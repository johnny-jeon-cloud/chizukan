<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chizukan（チズカン）原型</title>
<meta name="author" content="{i}Final">
<meta name="theme-color" content="#f3ecdc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="チズカン">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta property="og:type" content="website">
<meta property="og:image" content="og.png">
<meta property="og:title" content="Chizukan（チズカン）— 都市と名所のカードバトル">
<meta property="og:description" content="世界の都市・名所を集めて、3枚で戦うカードゲーム（原型版）">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:creator" content="@JohnnyJeon">
<style>
[hidden]{display:none!important}img{max-width:100%}
:root{
  --paper:#f3ecdc; --paper2:#ebe2cc; --ink:#1d2a38; --ink2:#52606f; --red:#c43d2a; --line:#cfc3a3;
  --a-sea:#3f7fa6; --a-city:#7a6a8f; --a-mt:#5c8a5a; --a-his:#b07d3a;
  --serif:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --sans:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
body{background:
  linear-gradient(var(--paper),var(--paper)),
  repeating-linear-gradient(0deg,transparent 0 31px,rgba(29,42,56,.05) 31px 32px),
  repeating-linear-gradient(90deg,transparent 0 31px,rgba(29,42,56,.05) 31px 32px);
  background-blend-mode:normal}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 0 calc(76px + env(safe-area-inset-bottom));position:relative;
  background:
    repeating-linear-gradient(0deg,transparent 0 31px,rgba(29,42,56,.045) 31px 32px),
    repeating-linear-gradient(90deg,transparent 0 31px,rgba(29,42,56,.045) 31px 32px),var(--paper)}
header.top{padding:calc(14px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);background:var(--paper)}
.logo{font-family:var(--serif);font-weight:700;font-size:24px;letter-spacing:.04em;line-height:1}
.logo small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.2em;color:var(--ink2);font-weight:400;margin-top:4px}
.pts{text-align:right;font-size:11px;color:var(--ink2);line-height:1.3}
.pts b{font-family:var(--serif);font-size:20px;color:var(--ink);display:block}
.proto{background:var(--ink);color:var(--paper);font-size:11px;text-align:center;padding:3px 8px;letter-spacing:.08em}
main{padding:14px 16px}
h2{font-family:var(--serif);font-size:18px;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
h2::after{content:"";flex:1;height:1px;background:var(--ink);opacity:.35}
h3{font-size:14px;margin:14px 0 4px}
p{margin:6px 0}
.muted{color:var(--ink2);font-size:12px}
.btn{display:block;width:100%;border:2px solid var(--ink);background:var(--ink);color:var(--paper);font:700 16px var(--sans);padding:13px 14px;border-radius:4px;letter-spacing:.06em;box-shadow:3px 3px 0 var(--red)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--red)}
.btn.sub{background:var(--paper);color:var(--ink);box-shadow:3px 3px 0 var(--line)}
.btn.sm{display:inline-block;width:auto;font-size:13px;padding:7px 12px;box-shadow:2px 2px 0 var(--red)}
.btn[disabled]{opacity:.4;box-shadow:none}
.box{border:1.5px solid var(--ink);background:rgba(255,252,243,.8);padding:12px;border-radius:4px;margin:10px 0}
.row{display:flex;gap:10px;align-items:center}
.row.sp{justify-content:space-between}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border:1px solid var(--ink);border-radius:20px;background:var(--paper)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);background:var(--ink);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.tabs button{background:none;border:0;color:#b9b19b;font:600 12px var(--sans);padding:12px 0 10px;letter-spacing:.02em;position:relative}
nav.tabs button.on{color:#fff}
nav.tabs button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;background:var(--red)}
/* カード（古地図・標本図版）。幅300px基準＝100cqw */
.card{--sealc:#c2392a;--frc:#2a2218;container-type:inline-size;position:relative;aspect-ratio:5/7;border-radius:4cqw;color:#2a2218;overflow:hidden;
  background:radial-gradient(120% 90% at 30% 10%,rgba(255,252,240,.9),transparent 60%),url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .36  0 0 0 0 .2  0 0 0 .22 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>"),var(--paper,#efe4cb);
  box-shadow:0 0 0 1px #8b7a55 inset,0 2px 6px rgba(0,0,0,.28);display:block}
.card.R{--sealc:#2f5f86;--frc:#2b3f55}
.card.SR{--sealc:#a8741a;--frc:#7a5410;box-shadow:0 0 0 1px #b8891f inset,0 0 0 2px rgba(199,154,43,.6),0 3px 10px rgba(199,154,43,.45)}
.card.SSR{--sealc:#c2392a;--frc:#7a5410;box-shadow:0 0 0 1px #b8891f inset,0 0 0 2px rgba(232,180,58,.75),0 0 14px rgba(232,180,58,.6)}
.card .fr{position:absolute;inset:3cqw;border:max(1px,.5cqw) solid var(--frc);border-radius:3.4cqw}
.card .fr2{position:absolute;inset:4.7cqw;border:max(.5px,.2cqw) solid var(--frc);border-radius:2.4cqw}
.card .hdr{position:absolute;left:8cqw;right:8cqw;top:7cqw;display:flex;justify-content:space-between;align-items:center;font:700 3.3cqw var(--sans);letter-spacing:.22em}
.card .hdr .no{font:italic 600 4.3cqw "Cormorant Garamond",var(--serif);letter-spacing:.12em}
.card .seal{width:12cqw;height:12cqw;border:max(1px,.65cqw) solid var(--sealc);border-radius:1.6cqw;color:var(--sealc);display:grid;place-items:center;font:800 4.2cqw var(--serif);transform:rotate(-6deg);background:rgba(194,57,42,.05);letter-spacing:0;position:relative}
.card .seal::after{content:"";position:absolute;inset:.7cqw;border:max(.5px,.26cqw) solid var(--sealc);border-radius:1cqw}
.card .plate{position:absolute;left:8cqw;right:8cqw;top:18cqw;height:57.3cqw;border:max(1px,.4cqw) solid #2a2218;background:linear-gradient(#f6edd6,#eadfc2);overflow:hidden}
.card .plate::before{content:"";position:absolute;inset:1cqw;border:max(.5px,.17cqw) solid #2a2218;pointer-events:none;z-index:3}
.card .plate svg{position:absolute;inset:0;width:100%;height:100%}
.plate .gr line{stroke:#2a2218;stroke-width:.25;opacity:.35}.plate .ct ellipse{fill:none;stroke:#2a2218;stroke-width:.35}
.plate .f{fill:#d8c9a0;stroke:#2a2218;stroke-width:.4}
.plate .m,.plate .m2{stroke:#2a2218;stroke-width:.7;stroke-linejoin:round}.plate .m{fill:url(#hatch)}.plate .m2{fill:#efe4cb}
.plate .l{stroke:#2a2218;stroke-width:.5;fill:none}.plate .a{fill:#c2392a;stroke:#2a2218;stroke-width:.5}.plate .r{fill:#c2392a;opacity:.75}.plate .g{fill:#2a2218;opacity:.18}
.card .ar{position:absolute;left:2.6cqw;top:2.6cqw;z-index:6;font:700 3cqw var(--sans);letter-spacing:.2em;padding:.5cqw 2cqw;background:#2a2218;color:#efe4cb}
.card .at{position:absolute;right:2.6cqw;bottom:2.6cqw;z-index:6;width:8.7cqw;height:8.7cqw;border-radius:50%;background:#2a2218;color:#efe4cb;display:grid;place-items:center;font:700 4cqw var(--serif);box-shadow:0 0 0 .7cqw #efe4cb,0 0 0 1cqw #2a2218}
.card .coord{position:absolute;left:8cqw;right:8cqw;top:76.7cqw;display:flex;justify-content:space-between;font:italic 500 3.3cqw "Cormorant Garamond",serif;letter-spacing:.08em}
.card .ttl{position:absolute;left:6cqw;right:6cqw;top:82cqw;text-align:center}
.card .ttl .jp{font:800 11.3cqw/1.1 var(--serif);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ttl .en{font:600 3.1cqw var(--sans);letter-spacing:.3em;margin-top:1.6cqw;color:#5b4d36;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .orn{position:absolute;left:20cqw;right:20cqw;top:102cqw;height:3cqw;display:flex;align-items:center;gap:2.6cqw}
.card .orn i{flex:1;border-top:max(.5px,.26cqw) solid #2a2218}.card .orn b{width:2cqw;height:2cqw;background:#c2392a;transform:rotate(45deg)}
.card .dsc{position:absolute;left:11cqw;right:11cqw;top:107cqw;text-align:center;font:500 3.4cqw/1.5 var(--serif);color:#3b3226;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .stats{position:absolute;left:8cqw;right:8cqw;bottom:6.5cqw;display:grid;grid-template-columns:repeat(3,1fr);gap:1.3cqw}
.card .dl{position:relative;display:flex;flex-direction:column;align-items:center}
.card .dl svg{width:14cqw;height:14cqw}
.card .dl b{position:absolute;top:4.1cqw;font:700 4.6cqw var(--serif)}
.card .dl small{font:700 2.7cqw var(--sans);letter-spacing:.24em;margin-top:.3cqw;color:#5b4d36}

/* カード裏面（標本データ） */
.card.back .bk{position:absolute;left:8cqw;right:8cqw;top:8cqw;bottom:8cqw;display:flex;flex-direction:column}
.card.back .bk .t{display:flex;justify-content:space-between;align-items:center;font:italic 600 4.3cqw "Cormorant Garamond",var(--serif);letter-spacing:.12em}
.card.back .bk h3{font:800 9cqw/1.15 var(--serif);text-align:center;margin:4cqw 0 0;letter-spacing:.06em}
.card.back .bk .sub{font:600 3cqw var(--sans);letter-spacing:.3em;text-align:center;color:#5b4d36;margin:1.4cqw 0 3cqw}
.card.back table{width:100%;border-collapse:collapse;font:500 3.5cqw/1.35 var(--serif)}
.card.back th{width:20cqw;text-align:left;font:700 2.9cqw var(--sans);letter-spacing:.18em;color:#5b4d36;padding:1.7cqw 0;border-top:max(.5px,.25cqw) solid #2a2218;vertical-align:top}
.card.back td{padding:1.7cqw 0;border-top:max(.5px,.25cqw) solid #2a2218}
.card.back .fl2{margin-top:2.4cqw;font:500 3.3cqw/1.55 var(--serif);color:#3b3226;border-left:max(1px,.6cqw) solid #c2392a;padding-left:2.4cqw}
.card.back .src{margin-top:auto;text-align:center;font:700 3.3cqw var(--sans);letter-spacing:.1em}
.card.back .src a{display:inline-block;color:#2a2218;border:max(1px,.5cqw) solid #2a2218;padding:1.6cqw 4cqw;border-radius:1cqw;text-decoration:none;background:rgba(255,252,243,.7)}
.card.back .src small{display:block;margin-top:1.6cqw;font:500 2.7cqw var(--sans);color:#6a5c42;letter-spacing:.04em}
.card.back::before,.card.back::after{display:none}

.plate img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:2}
.plate.paint img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.plate.paint .ar{background:rgba(32,28,25,.78);color:#f4ecd8}
.plate.paint .at{background:rgba(32,28,25,.85);color:#f4ecd8}
/* 水墨ふうの図版 */
.plate.ink{background:#f4ecd8}
.plate.ink .m{fill:#201c19;fill-opacity:.86;stroke:#201c19;stroke-width:.35}.plate.ink .m2{fill:#f4ecd8;stroke:#201c19;stroke-width:.55}
.plate.ink .l{stroke:#201c19;stroke-width:.42}.plate.ink .a{fill:#c2392a;stroke:none;fill-opacity:.9}.plate.ink .r{fill:#c2392a;opacity:.5}
.plate.ink .f{fill:#6f6a62;fill-opacity:.32;stroke:none}.plate.ink .g{fill:#201c19;opacity:.16}
.plate.ink .gr,.plate.ink .ct{display:none}
.plate.ink .seal2{position:absolute;right:3.4cqw;top:3cqw;z-index:6;width:6cqw;height:6cqw;background:#c2392a;color:#f4ecd8;display:grid;place-items:center;font:800 3.4cqw var(--serif);border-radius:.6cqw;transform:rotate(4deg);opacity:.92}
.plate.ink .ar{background:none;color:#201c19;font-family:var(--serif);letter-spacing:.2em;padding:0;top:3.2cqw;left:3.4cqw;font-size:3.2cqw}
.plate.ink .at{background:none;color:#201c19;box-shadow:none;border:max(1px,.4cqw) solid #201c19;border-radius:50%}
/* ミニ表示：図版・名前・数値だけ */
.card.mini .hdr .no,.card.mini .hdr .kd,.card.mini .coord,.card.mini .en,.card.mini .orn,.card.mini .dsc,.card.mini .ar,.card.mini .at{display:none}
.card.mini .hdr{top:5.5cqw;justify-content:flex-end;left:8cqw;right:8cqw;z-index:7;pointer-events:none}
.card.mini .seal{width:11cqw;height:11cqw;font-size:4.4cqw;background:#efe4cb}
.card.mini .plate{top:8cqw;height:66cqw}
.card.mini .ttl{top:77cqw}.card.mini .ttl .jp{font-size:13cqw}
.card.mini .stats{bottom:5cqw;gap:0}
.card.mini .dl svg{display:none}.card.mini .dl b{position:static;font-size:11cqw;line-height:1}.card.mini .dl small{font-size:5cqw;letter-spacing:.1em}
/* レア演出 */
.card.SR::after,.card.SSR::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:8;border-radius:inherit;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.55) 50%,transparent 62%);background-size:260% 100%;background-position:130% 0;mix-blend-mode:soft-light;animation:sweep 4.5s ease-in-out infinite}
.card.SSR::after{background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.65) 48%,transparent 62%),linear-gradient(135deg,rgba(255,80,80,.16),rgba(255,220,80,.2),rgba(80,200,255,.2),rgba(200,100,255,.16));background-size:260% 100%,100% 100%;background-position:130% 0,0 0}
@keyframes sweep{0%,55%{background-position:130% 0,0 0}100%{background-position:-30% 0,0 0}}
.card.SSR::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:9;background:radial-gradient(circle at 18% 22%,#fff 0 1.2px,transparent 2px),radial-gradient(circle at 78% 16%,#fff 0 1px,transparent 2px),radial-gradient(circle at 62% 38%,#fff6c2 0 1.4px,transparent 2.4px),radial-gradient(circle at 30% 44%,#fff 0 1px,transparent 2px),radial-gradient(circle at 88% 40%,#fff6c2 0 1.2px,transparent 2.2px);animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tile{position:relative;cursor:pointer}
.tile .cnt{position:absolute;right:-3px;top:-6px;background:var(--red);color:#fff;font:700 11px var(--sans);border-radius:10px;padding:0 6px;z-index:2}
.locked{aspect-ratio:5/7;border:2px dashed var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#b3a885;font-family:var(--serif);background:rgba(255,252,243,.4)}
.locked b{font-size:28px}.locked span{font-size:10px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.filters button{border:1px solid var(--ink);background:var(--paper);font:600 12px var(--sans);padding:4px 10px;border-radius:16px;color:var(--ink)}
.filters button.on{background:var(--ink);color:var(--paper)}
/* モーダル */
.ov{position:fixed;inset:0;background:rgba(20,28,38,.82);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.ov .sheet{width:100%;max-width:420px;margin:auto}
.ov .panel{background:var(--paper);border:2px solid var(--ink);border-radius:6px;padding:14px;max-height:92vh;overflow:auto}
.detail .card{max-width:230px;margin:0 auto 12px}
.dt{font-size:13px}.dt .fl{font-family:var(--serif);border-left:3px solid var(--red);padding-left:9px;margin:10px 0}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left}
table.t th{font-weight:600;color:var(--ink2)}
/* パック演出 */
.pack3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.flip{perspective:700px;cursor:pointer}
.flip .in{position:relative;aspect-ratio:5/7;transition:transform .55s;transform-style:preserve-3d}
.flip.open .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .f{transform:rotateY(180deg)}
.flip .b{border:3px solid var(--paper);border-radius:8px;background:var(--ink);display:flex;align-items:center;justify-content:center;color:var(--paper);font:700 30px var(--serif);
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 6px,transparent 6px 12px)}
.newb.dup{background:var(--a-sea)}
.newb{position:absolute;top:-8px;left:-4px;background:var(--red);color:#fff;font:700 11px var(--sans);padding:1px 7px;border-radius:3px;z-index:3;transform:rotate(-8deg)}
/* 編成 */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{cursor:pointer;position:relative}
.slot .lab{font-size:11px;text-align:center;margin-bottom:3px;color:var(--ink2)}
.empty{aspect-ratio:5/7;border:2px dashed var(--ink2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--ink2)}
.pickrow{display:flex;gap:10px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:4px;margin:5px 0;background:rgba(255,252,243,.7);cursor:pointer}
.pickrow .card{width:46px;flex:none}
.pickrow.sel{border-color:var(--red);background:#fff3ee}
/* 対戦 */
.side{margin:6px 0}
.fighters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fg{border:1.5px solid var(--ink);border-radius:5px;padding:5px 6px;background:rgba(255,252,243,.9);font-size:11px;position:relative;transition:opacity .3s}
.fg.act{box-shadow:0 0 0 3px var(--red)}
.fg.ko{opacity:.35;filter:grayscale(1)}
.fg .n{font:700 13px var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hpbar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:3px}
.hpbar i{display:block;height:100%;background:var(--a-mt);transition:width .5s}
.fg .hpt{font-size:10px;color:var(--ink2)}
.dmg{position:absolute;right:4px;top:-9px;font:800 15px var(--serif);color:var(--red);animation:pop .8s ease-out forwards}
@keyframes pop{0%{transform:translateY(8px);opacity:0}25%{opacity:1}100%{transform:translateY(-8px);opacity:0}}
.vs{text-align:center;font-family:var(--serif);font-weight:700;letter-spacing:.2em;margin:8px 0;color:var(--red)}
.logline{font-size:12px;border-bottom:1px dashed var(--line);padding:3px 0}
.res{font:800 40px var(--serif);text-align:center;margin:8px 0 2px}
.res.win{color:var(--red)}.res.lose{color:var(--ink2)}
.tag{font-size:10px;padding:0 5px;border-radius:2px;color:#fff;background:var(--ink2)}
.pity{height:8px;background:var(--line);border-radius:5px;overflow:hidden}.pity i{display:block;height:100%;background:var(--red)}
/* 図鑑：進捗・シルエット */
.prog{height:10px;background:var(--line);border-radius:6px;overflow:hidden;border:1px solid var(--ink)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--a-mt),var(--a-sea))}
.arearow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 4px}
.areabox{border:1px solid var(--ink);border-radius:4px;padding:4px 6px;background:rgba(255,252,243,.8);font-size:11px}
.areabox b{font:700 14px var(--serif);display:block}
.areabox .prog{height:5px;margin-top:3px;border-width:0}
.sil{position:relative;aspect-ratio:5/7;border:2px dashed var(--line);border-radius:8px;overflow:hidden;background:rgba(255,252,243,.4);display:flex;flex-direction:column}
.sil .art{flex:0 0 52%;filter:grayscale(1) brightness(.55) contrast(1.1);opacity:.5}
.sil .art svg{width:100%;height:100%;display:block}
.sil .q{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#a99d7c;font-family:var(--serif)}
.sil .q b{font-size:22px;line-height:1}.sil .q span{font-size:10px;margin-top:3px}
.sil .tg{position:absolute;top:4px;left:4px;font-size:9px;background:var(--paper);border:1px solid var(--line);padding:0 5px;border-radius:2px;color:var(--ink2)}
/* パック画面 */
.hero{display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px 0 4px}
.packart{width:150px;aspect-ratio:5/7;border:3px solid var(--ink);border-radius:10px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;box-shadow:5px 5px 0 var(--red);cursor:pointer;
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 6px,transparent 6px 12px);animation:float 3.2s ease-in-out infinite}
.packart .pk-in{text-align:center}.packart svg{width:56px;display:block;margin:0 auto 8px;opacity:.95}
.packart b{display:block;font:700 15px var(--serif);letter-spacing:.2em}.packart small{font-size:10px;letter-spacing:.2em;opacity:.75}
.packart.gold{background-color:#6b4d12;border-color:#e8b43a;box-shadow:0 0 22px rgba(232,180,58,.8),5px 5px 0 var(--red);color:#fff3c4}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.pips{display:flex;gap:5px}.pips i{width:14px;height:8px;border:1.5px solid var(--ink);border-radius:2px;background:transparent}.pips i.on{background:var(--red);border-color:var(--red)}
.hero .btn{max-width:300px}
/* 開封演出 */
.flip .b{flex-direction:column;gap:6px;background-color:var(--ink)}
.flip .b svg{width:46%;height:auto;opacity:.9}
.flip .b small{font:600 9px var(--sans);letter-spacing:.25em;opacity:.7}
.pack3 .flip{animation:drop .45s cubic-bezier(.2,.9,.3,1.2) both}
.pack3 .flip:nth-child(2){animation-delay:.12s}.pack3 .flip:nth-child(3){animation-delay:.24s}
@keyframes drop{from{opacity:0;transform:translateY(-40px) rotate(-4deg)}to{opacity:1;transform:none}}
.burst{position:absolute;inset:-30%;pointer-events:none;opacity:0;z-index:4;border-radius:50%}
.flip.open .burst.SSR{background:radial-gradient(circle,rgba(255,236,160,.95) 0,rgba(232,180,58,.55) 30%,transparent 62%);animation:burst 1s .3s ease-out}
.flip.open .burst.SR{background:radial-gradient(circle,rgba(255,244,200,.8) 0,rgba(199,154,43,.4) 28%,transparent 58%);animation:burst .8s .3s ease-out}
@keyframes burst{0%{opacity:0;transform:scale(.3)}30%{opacity:1}100%{opacity:0;transform:scale(1.4)}}


/* ---- batch B ---- */
.season{background:linear-gradient(135deg,#1e2b3b,#2d3f56);color:#f1ead6;border-radius:12px;padding:12px 14px;margin:12px 0}
.season .r1{display:flex;justify-content:space-between;align-items:center}
.season .rk{font:700 20px var(--serif);letter-spacing:.1em}
.season .bar{height:7px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden;margin:8px 0 4px}
.season .bar i{display:block;height:100%;background:#e8b43a}
.season .st{display:flex;gap:14px;font-size:12px;opacity:.9;margin-top:6px}
.season .st b{font:700 15px var(--serif)}
.mx{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:10px 0;background:var(--paper)}
.mrow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.mrow:last-of-type{border-bottom:none}
.mrow span small{display:block;color:var(--ink2);font-size:10.5px}
.mrow span:last-child{text-align:right}
.mchip{font:700 11px var(--sans);padding:2px 8px;border-radius:10px;border:1px solid var(--ink2);color:var(--ink2)}
.mchip.up{background:#2f7d4f;border-color:#2f7d4f;color:#fff}.mchip.dn{background:#b3402e;border-color:#b3402e;color:#fff}
.mtally{display:flex;gap:12px;font-size:12px;margin-top:6px}
.fl{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;align-items:center}
.fl>span{font-size:11px;color:var(--ink2);min-width:34px}
.fl button{font:600 12px var(--sans);padding:3px 10px;border:1px solid var(--ink2);border-radius:14px;background:none;color:var(--ink);cursor:pointer}
.fl button.on{background:var(--ink);color:var(--paper)}
.codebox{width:100%;min-height:70px;font:11px/1.3 monospace;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fffdf6;color:var(--ink);word-break:break-all;box-sizing:border-box}
/* ---- batch A ---- */
.resov{background:rgba(6,10,16,.9)!important;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.mute{background:none;border:1px solid var(--ink2);border-radius:14px;font-size:12px;padding:1px 8px;margin-left:6px;color:var(--ink2);cursor:pointer}
.rankchip{display:inline-block;font:700 11px var(--serif);padding:1px 8px;border-radius:10px;background:var(--ink);color:var(--paper);margin-right:4px;letter-spacing:.08em}
.ov.tear{flex-direction:column;background:radial-gradient(circle at 50% 45%,rgba(40,50,70,.95),rgba(10,14,20,.97))}
.tearbox{position:relative;width:170px;height:240px;--gl:#cfd8e3}
.tearbox.tR{--gl:#6fb3e8}.tearbox.tSR{--gl:#e0b240}.tearbox.tSSR{--gl:#ffd66b}
.tearbox .h1,.tearbox .h2{position:absolute;left:0;right:0;background:linear-gradient(160deg,#2c3a4d,#18222f);border:2px solid var(--gl);display:flex;align-items:center;justify-content:center;overflow:hidden}
.tearbox .h1{top:0;height:46%;border-radius:10px 10px 0 0;border-bottom:none;animation:tup 1.5s ease-in both;transform-origin:0 100%}
.tearbox .h2{bottom:0;height:54%;border-radius:0 0 10px 10px;border-top:none;animation:tdn 1.5s ease-in both}
.tearbox .h1 svg,.tearbox .h2 svg{width:60px;opacity:.7;position:absolute}
.tearbox .h1 svg{bottom:-18px}.tearbox .h2 svg{top:-30px}
.tearbox .gl{position:absolute;left:-40%;right:-40%;top:42%;height:16%;background:radial-gradient(ellipse,var(--gl) 0,transparent 70%);opacity:0;animation:tgl 1.5s ease-in both;filter:blur(4px)}
.tearbox .rays{position:absolute;inset:-120px;background:conic-gradient(from 0deg,transparent 0 8%,var(--gl) 9%,transparent 11% 20%,var(--gl) 21%,transparent 23% 33%,var(--gl) 34%,transparent 36% 50%,var(--gl) 51%,transparent 53% 66%,var(--gl) 67%,transparent 69% 80%,var(--gl) 81%,transparent 83%);-webkit-mask:radial-gradient(circle,#000 0,transparent 65%);mask:radial-gradient(circle,#000 0,transparent 65%);opacity:0;animation:trays 1.5s ease-in both}
@keyframes tup{0%,45%{transform:none}55%{transform:translateX(-3px) rotate(-1deg)}65%{transform:translateX(3px) rotate(1deg)}75%{transform:translate(-6px,-2px) rotate(-3deg)}100%{transform:translate(-70px,-200px) rotate(-38deg);opacity:0}}
@keyframes tdn{0%,45%{transform:none}55%{transform:translateX(3px)}65%{transform:translateX(-3px)}75%{transform:translate(4px,2px)}100%{transform:translate(60px,200px) rotate(24deg);opacity:0}}
@keyframes tgl{0%,50%{opacity:0;transform:scaleX(.3)}75%{opacity:1;transform:scaleX(1)}100%{opacity:1;transform:scaleX(2.4) scaleY(6)}}
@keyframes trays{0%,60%{opacity:0;transform:rotate(0) scale(.4)}100%{opacity:.9;transform:rotate(40deg) scale(1.3)}}
.tearbox{animation:tshake 1.5s ease-in both}
@keyframes tshake{0%{transform:scale(.7);opacity:0}15%{transform:scale(1);opacity:1}35%{transform:rotate(-2deg)}45%{transform:rotate(2deg)}55%{transform:rotate(-3deg)}65%{transform:rotate(3deg)}100%{transform:scale(1.12)}}
.tearhint{color:#9fa9b8;font:12px var(--sans);margin-top:26px;letter-spacing:.1em}
.vs{position:absolute;inset:0;z-index:20;background:radial-gradient(circle at 50% 50%,#1c2a3c,#080c12);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.vs .vt{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:6px}
.vs .vt.o{top:12%;animation:vsin1 .55s cubic-bezier(.2,.9,.3,1.1) both}
.vs .vt.m{bottom:12%;animation:vsin2 .55s .15s cubic-bezier(.2,.9,.3,1.1) both}
.vs .vt .cd{width:27vw;max-width:110px}
.vs .vn{position:absolute;left:14px;font:700 13px var(--serif);color:#d8cfb8;letter-spacing:.15em}
.vs .vt.o .vn{top:-20px}.vs .vt.m .vn{bottom:-22px}
.vs .vtx{font:900 76px/1 var(--serif);color:#f3d27a;text-shadow:0 0 24px #e8b43a,0 4px 0 #6b4a0e;animation:vspop .6s .55s cubic-bezier(.2,1.6,.4,1) both}
.vs::before{content:"";position:absolute;left:-10%;right:-10%;top:50%;height:3px;background:linear-gradient(90deg,transparent,#e8b43a,transparent);animation:vsline .6s .45s ease-out both}
@keyframes vsin1{from{transform:translateX(120%);opacity:0}to{transform:none;opacity:1}}
@keyframes vsin2{from{transform:translateX(-120%);opacity:0}to{transform:none;opacity:1}}
@keyframes vspop{from{transform:scale(3);opacity:0}to{transform:none;opacity:1}}
@keyframes vsline{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rkb{margin:6px 0 2px;padding:6px 14px;border-radius:8px;font:700 15px var(--serif);text-align:center;animation:rkpop .7s cubic-bezier(.2,1.5,.4,1) both}
.rkb.up{background:linear-gradient(90deg,#8a6a12,#f3d27a,#8a6a12);color:#2a1d00}
.rkb.dn{background:#34404f;color:#cdd6e2}
.rkbar{height:6px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden;margin:6px 0}
.rkbar i{display:block;height:100%;background:#e8b43a;transition:width 1s .4s}
@keyframes rkpop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.flip.open.hiSSR .in{animation:wob .6s .5s ease-in-out}
@keyframes wob{0%,100%{transform:rotateY(180deg) scale(1)}50%{transform:rotateY(180deg) scale(1.08)}}
.flip .f{overflow:visible}
.rarhint{color:#e8b43a;font:700 13px var(--serif);text-align:center;min-height:18px;margin-top:10px;letter-spacing:.1em}
/* 対戦演出 */
.fg.hit{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.dmg{font-size:20px;text-shadow:0 1px 0 #fff;top:-14px}
.mt{position:absolute;left:4px;top:-9px;font:700 10px var(--sans);padding:0 5px;border-radius:8px;color:#fff;z-index:2}
.mt.up{background:var(--red)}.mt.dn{background:var(--ink2)}
.matchup{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin:8px 0;font-size:12px;text-align:center}
.matchup .sc{font:700 13px var(--serif);padding:3px 8px;border-radius:12px;color:#fff}
.sc.up{background:var(--red)}.sc.dn{background:var(--ink2)}.sc.eq{background:var(--a-sea)}
.detail .card{transition:transform .15s ease-out;will-change:transform}

/* ---------- 対戦ステージ ---------- */
.stg{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;color:#efe4cb;overflow:hidden;
  background:radial-gradient(120% 70% at 50% 45%,#2a3442 0%,#151b25 60%,#0c1017 100%)}
.stg::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;background:repeating-linear-gradient(90deg,transparent 0 31px,rgba(255,255,255,.035) 31px 32px),repeating-linear-gradient(0deg,transparent 0 31px,rgba(255,255,255,.035) 31px 32px)}
.stg.shake{animation:stgshake .32s}
@keyframes stgshake{0%,100%{transform:none}20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,2px)}}
.stg .top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 14px 4px;font:700 12px var(--sans);letter-spacing:.12em;color:#b9b19b}
.stg .tside{position:relative;z-index:2;padding:0 12px}
.stg .thead{display:flex;align-items:center;gap:8px;font:700 12px var(--serif)}
.stg .thead b{min-width:64px;max-width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stg .tbar{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.stg .tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#c2392a,#e8b43a);transition:width .6s}
.stg .tside.me .tbar i{background:linear-gradient(90deg,#3f7fa6,#7bc29a)}
.stg .tt{font:600 10px var(--sans);color:#b9b19b;min-width:62px;text-align:right}
.stg .bench{display:flex;justify-content:center;gap:10px;margin:5px 0}
.stg .bc{width:54px;position:relative;transition:opacity .4s,filter .4s,transform .3s}
.stg .bc .card{width:54px}
.stg .bc .bh{height:4px;background:rgba(255,255,255,.14);border-radius:2px;margin-top:3px;overflow:hidden}
.stg .bc .bh i{display:block;height:100%;background:#7bc29a;transition:width .5s}
.stg .bc.on{transform:translateY(-3px);filter:drop-shadow(0 0 6px rgba(232,180,58,.9))}
.stg .bc.ko{opacity:.28;filter:grayscale(1)}
.stg .arena{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;min-height:0}
.stg .ac{position:relative;width:min(36vw,16.6vh);transition:transform .22s cubic-bezier(.2,.9,.3,1.2)}
.stg .ac .acc{transition:transform .22s cubic-bezier(.2,.9,.3,1.2),opacity .4s,filter .4s;filter:drop-shadow(0 6px 10px rgba(0,0,0,.55))}
.stg .ac.opp.lunge .acc{transform:translateY(24px) scale(1.07)}
.stg .ac.me.lunge .acc{transform:translateY(-24px) scale(1.07)}
.stg .ac.hit .acc{animation:acthit .3s}
@keyframes acthit{0%{filter:brightness(2.2) drop-shadow(0 0 14px #fff)}100%{filter:none}}
.stg .ac.dead .acc{opacity:.25;filter:grayscale(1);transform:scale(.92)}
.stg .ac.enter .acc{animation:acenter .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes acenter{from{opacity:0;transform:translateY(var(--ey,30px)) scale(.8)}to{opacity:1;transform:none}}
.stg .ahp{position:relative;height:13px;margin-top:5px;border-radius:7px;background:rgba(255,255,255,.14);overflow:hidden}
.stg .ahp i{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,#c2392a,#e8b43a);transition:width .55s}
.stg .ac.me .ahp i{background:linear-gradient(90deg,#3f7fa6,#7bc29a)}
.stg .ahp span{position:absolute;inset:0;text-align:center;font:700 9.5px/13px var(--sans);color:#fff;text-shadow:0 1px 2px #000}
.stg .dn{position:absolute;left:50%;top:30%;z-index:9;font:800 30px var(--serif);color:#fff;text-shadow:0 0 6px #c2392a,0 0 12px #c2392a,0 2px 0 #000;transform:translateX(-50%);animation:dnfloat 1.1s ease-out forwards;pointer-events:none;white-space:nowrap}
@keyframes dnfloat{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,-6px) scale(1.25)}100%{opacity:0;transform:translate(-50%,-44px) scale(1)}}
.stg .mtc{position:absolute;left:50%;top:-12px;transform:translateX(-50%);z-index:8;font:800 11px var(--sans);letter-spacing:.06em;padding:2px 9px;border-radius:10px;color:#fff;white-space:nowrap;animation:mtpop .5s}
.stg .mtc.up{background:#c2392a;box-shadow:0 0 10px #c2392a}.stg .mtc.dn2{background:#52606f}
@keyframes mtpop{from{opacity:0;transform:translate(-50%,6px) scale(.6)}to{opacity:1;transform:translateX(-50%)}}
.stg .mid{position:relative;z-index:3;text-align:center;height:34px;display:flex;align-items:center;justify-content:center}
.stg .mid .rn{font:800 15px var(--serif);letter-spacing:.3em;color:#e8b43a;text-shadow:0 0 8px rgba(232,180,58,.5)}
.stg .clash{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;z-index:4;pointer-events:none;opacity:0;
  background:radial-gradient(circle,#fff 0 8%,rgba(255,220,120,.9) 14%,rgba(194,57,42,.55) 34%,transparent 62%),conic-gradient(from 0deg,transparent 0 6%,rgba(255,255,255,.9) 7% 9%,transparent 10% 24%,rgba(255,255,255,.9) 25% 27%,transparent 28% 49%,rgba(255,255,255,.9) 50% 52%,transparent 53% 74%,rgba(255,255,255,.9) 75% 77%,transparent 78%);
  -webkit-mask:radial-gradient(circle,#000 55%,transparent 72%);mask:radial-gradient(circle,#000 55%,transparent 72%)}
.stg .clash.go{animation:clashgo .5s ease-out}
@keyframes clashgo{0%{opacity:0;transform:scale(.3) rotate(0)}25%{opacity:1;transform:scale(1.05) rotate(20deg)}100%{opacity:0;transform:scale(1.5) rotate(50deg)}}
.stg .ctl{position:relative;z-index:2;display:flex;gap:10px;justify-content:center;padding:6px 14px calc(10px + env(safe-area-inset-bottom))}
.stg .ctl button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.35);color:#efe4cb;font:700 13px var(--sans);padding:8px 16px;border-radius:18px;letter-spacing:.06em}
.stg .logbox{position:relative;z-index:2;margin:0 14px;font-size:11px;color:#b9b19b}
.stg .logbox summary{cursor:pointer;padding:2px 0}
.stg .logbox .lg{max-height:110px;overflow:auto}
.stg .logbox .lg div{border-bottom:1px dashed rgba(255,255,255,.15);padding:2px 0}
.stg .resov{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(8,11,16,.78);animation:resfade .4s;padding:20px;text-align:center}
@keyframes resfade{from{opacity:0}to{opacity:1}}
.stg .resov .stamp{width:min(46vw,190px);aspect-ratio:1;border:7px solid #c2392a;border-radius:14px;color:#c2392a;display:grid;place-items:center;font:800 min(18vw,76px) var(--serif);transform:rotate(-8deg);background:rgba(194,57,42,.08);position:relative;animation:stampin .55s cubic-bezier(.2,1.6,.4,1) .15s both;text-shadow:0 0 18px rgba(194,57,42,.5)}
.stg .resov .stamp::after{content:"";position:absolute;inset:7px;border:2px solid #c2392a;border-radius:8px}
.stg .resov.lose .stamp{color:#8d99a8;border-color:#8d99a8;background:rgba(141,153,168,.08);text-shadow:none}
.stg .resov.lose .stamp::after{border-color:#8d99a8}
@keyframes stampin{from{opacity:0;transform:rotate(-8deg) scale(2.6)}to{opacity:1;transform:rotate(-8deg) scale(1)}}
.stg .resov .big{font:800 26px var(--serif);letter-spacing:.3em}
.stg .resov .pt{font:700 18px var(--serif);color:#e8b43a}
.stg .resov .sm{font-size:12px;color:#b9b19b}
.stg .resov .btn{max-width:260px}
.tut{position:fixed;inset:0;background:rgba(29,42,56,.78);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px}
.tut .tb{background:var(--paper);border:2px solid var(--ink);border-radius:6px;max-width:360px;width:100%;padding:20px 18px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.tut h3{margin:0 0 8px;font-family:var(--serif);font-size:19px}.tut p{margin:0 0 10px;font-size:14px;line-height:1.7}
.tut .dots{display:flex;gap:6px;justify-content:center;margin:6px 0 12px}.tut .dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.tut .dots i.on{background:var(--red)}
.tut .row{display:flex;gap:8px;justify-content:space-between}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:4px;font-size:13px;z-index:80;max-width:90%}

/* --- スキル選択・交代演出 --- */
.stg .skp{position:relative;z-index:6;padding:0 10px}
.stg .skp:empty{display:none}
.stg .skh{display:flex;justify-content:space-between;align-items:center;gap:6px;font:700 11px var(--sans);color:#e8dcc0;margin:4px 2px;animation:skin .25s both}
.stg .skh em{font-style:normal;padding:1px 6px;border-radius:8px;margin-left:4px;font-size:10px}
.stg .skh em.u{background:#2f7d57;color:#fff}.stg .skh em.d{background:#a33a2c;color:#fff}
.stg .skr{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;animation:skin .25s both}
@keyframes skin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.stg .sk{border:1.5px solid #c9a24a;background:rgba(20,28,40,.88);color:#f3e6c4;border-radius:10px;padding:7px 2px 6px;font-family:var(--serif);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.stg .sk b{font-size:15px;letter-spacing:.1em}.stg .sk small{font:500 9px/1.2 var(--sans);opacity:.8;text-align:center}

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><pattern id="hatch" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3.2" height="3.2" fill="#efe4cb"/><line x1="0" y1="0" x2="0" y2="3.2" stroke="#2a2218" stroke-width="1.1"/></pattern><filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="3" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="1.6"/></filter><filter id="ink" x="-8%" y="-8%" width="116%" height="116%"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="3" seed="7" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="3.2" result="d"/><feGaussianBlur in="d" stdDeviation=".28"/></filter><filter id="bleed" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="2" seed="2" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="4" result="d"/><feGaussianBlur in="d" stdDeviation="1.6"/></filter><filter id="fib" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".02 .9" numOctaves="2" seed="5"/><feColorMatrix values="0 0 0 0 .3 0 0 0 0 .25 0 0 0 0 .15 0 0 0 .07 0"/></filter><linearGradient id="mist" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4ecd8" stop-opacity="0"/><stop offset="1" stop-color="#f4ecd8" stop-opacity=".9"/></linearGradient></defs></svg>
<div id="app"></div>
<script>
// Chizukan 戦闘エンジン（規則 v0.7 候補）。HP×1・最大8回合・スキル（交代／防御／強攻）。
const RULES_VERSION = "v1.1";
const HP_MULT = 1;
const MAX_ROUNDS = 8;
const SKILL_USES = 3;
// 特性（R以上）: 属性ごとに1つ。海洋=先手／山岳=不動／都市=繁栄／歴史=再生
const TRAIT = { "海洋": "first", "山岳": "stand", "都市": "boom", "歴史": "regen" };
const TRAIT_JP = { first: "先手", stand: "不動", boom: "繁栄", regen: "再生" };
const TRAIT_DESC = { first: "先に攻撃し、倒せば反撃を受けない（先手同士は同時）", stand: "受けるダメージ×0.85", boom: "与えるダメージ×1.08", regen: "毎回合の終わりに最大HPの8%回復" };
// 特技（SR/SSR）: 聖盾=最初の被弾を1回無効／貫通=相手DEFの影響を半減／遺言=撃破時に相手へATK×0.6の固定ダメージ／凱旋=撃破後HPを15%回復
const KW_LIST = ["shield", "pierce", "rattle", "triumph"];
const KW_JP = { shield: "聖盾", pierce: "貫通", rattle: "遺言", triumph: "凱旋" };
const KW_DESC = { shield: "最初に受けるダメージを1回無効にする", pierce: "相手のDEFによる軽減が半分になる", rattle: "撃破されたとき、相手にATK×0.6の固定ダメージ", triumph: "相手を撃破したとき最大HPの15%回復" };
function kwFor(id, rar) { return rar === "SR" || rar === "SSR" ? KW_LIST[(id * 7 + 3) % 4] : null; }
function kwOf(c) { return c.kw || null; }
function traitOf(c) { return c.rar && c.rar !== "N" ? TRAIT[c.attr] || null : null; }
// 地域連携: 同地域2枚→その2枚のATK+5%／3枚→全員ATK+10%・HP+10%。補正後のカード（コピー）を返す。
function applySynergy(cards) {
  const cnt = {}; cards.forEach(c => { cnt[c.area] = (cnt[c.area] || 0) + 1; });
  return cards.map(c => {
    const n = cnt[c.area];
    if (n < 2) return Object.assign({}, c, { syn: 0 });
    const f = n >= 3 ? 1.1 : 1.05, g = n >= 3 ? 1.1 : 1;
    return Object.assign({}, c, { atk: roundHalfEven(c.atk * f), hp: roundHalfEven(c.hp * g), syn: n });
  });
}
function synText(cards) {
  const cnt = {}; cards.forEach(c => { cnt[c.area] = (cnt[c.area] || 0) + 1; });
  const k = Object.keys(cnt).filter(a => cnt[a] >= 2)[0]; if (!k) return "";
  return cnt[k] >= 3 ? `地域連携 ${k}×3：ATK+10%・HP+10%` : `地域連携 ${k}×2：ATK+5%`;
}
const BEAT = { "海洋": "都市", "都市": "山岳", "山岳": "歴史", "歴史": "海洋" };
function attrMult(a, d) {
  if (BEAT[a] === d) return 1.25;
  if (BEAT[d] === a) return 0.8;
  return 1.0;
}
function roundHalfEven(x) {
  const f = Math.floor(x), diff = x - f;
  if (diff < 0.5) return f;
  if (diff > 0.5) return f + 1;
  return f % 2 === 0 ? f : f + 1;
}
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeRoller(seed) {
  const r = mulberry32(seed);
  return () => 0.9 + 0.2 * r();
}
// スキル: swap=控えの生存カードと入れ替え（その回合から交代後が戦う）／guard=受けるダメージ×0.5／rush=与ダメ×1.5・受ダメ×1.25
// 各陣営は合計 SKILL_USES 回まで・1回合1つ。
function firstAlive(h, except) { for (let i = 0; i < h.length; i++) if (i !== except && h[i] > 0) return i; return -1; }
function calcDmg(a, b, roll, mine, theirs) {
  let d = a.atk * attrMult(a.attr, b.attr) * roll - (kwOf(a) === "pierce" ? 0.25 : 0.5) * b.def;
  if (traitOf(a) === "boom") d *= 1.08;
  if (traitOf(b) === "stand") d *= 0.85;
  if (mine === "rush") d *= 1.5;
  if (theirs === "guard") d *= 0.5;
  if (theirs === "rush") d *= 1.25;
  return Math.max(1, roundHalfEven(d));
}
// 自動方針（AI／スキップ時）。状態だけで決まるので再現可能。
function autoAct(side, ours, theirs, hOurs, hTheirs, i, j, used, maxOurs) {
  if (used >= SKILL_USES) return null;
  const a = ours[i], b = theirs[j];
  const m = attrMult(a.attr, b.attr);
  if (m < 1) {
    const k = firstAlive(hOurs, i);
    if (k >= 0 && attrMult(ours[k].attr, b.attr) > 1) return "swap";
  }
  const dealt = calcDmg(a, b, 1, "rush", null);
  if (dealt >= hTheirs[j] && calcDmg(a, b, 1, null, null) < hTheirs[j]) return "rush";
  const taken = calcDmg(b, a, 1, null, null);
  if (hOurs[i] / maxOurs[i] < 0.5 && taken >= hOurs[i] * 0.6 && taken * 0.5 < hOurs[i]) return "guard";
  return null;
}
// plans: {a:[...], b:[...]}。配列の要素: "swap"|"guard"|"rush"|null|"auto"。配列より後ろは null（plan が "auto" 文字列なら全回合 auto）。
function battle(A, B, roll, hpMult = HP_MULT, cap = MAX_ROUNDS, plans = {}) {
  const ha = A.map(c => c.hp * hpMult), hb = B.map(c => c.hp * hpMult);
  const mxA = ha.slice(), mxB = hb.slice();
  const maxA = ha.reduce((s, x) => s + x, 0), maxB = hb.reduce((s, x) => s + x, 0);
  const shA = A.map(c => kwOf(c) !== "shield"), shB = B.map(c => kwOf(c) !== "shield");   // true=聖盾なし／使用済み
  let ia = 0, ib = 0, ua = 0, ub = 0;
  const log = [];
  const pick = (pl, r) => pl === "auto" ? "auto" : (pl && pl[r - 1]) || null;
  for (let r = 1; r <= cap; r++) {
    let sa = pick(plans.a, r), sb = pick(plans.b, r);
    if (sa === "auto") sa = autoAct("a", A, B, ha, hb, ia, ib, ua, mxA);
    if (sb === "auto") sb = autoAct("b", B, A, hb, ha, ib, ia, ub, mxB);
    const fromA = ia, fromB = ib;
    if (sa && ua >= SKILL_USES) sa = null;
    if (sb && ub >= SKILL_USES) sb = null;
    if (sa === "swap") { const k = firstAlive(ha, ia); if (k < 0) sa = null; else ia = k; }
    if (sb === "swap") { const k = firstAlive(hb, ib); if (k < 0) sb = null; else ib = k; }
    if (sa) ua++; if (sb) ub++;
    const a = A[ia], b = B[ib];
    const da = calcDmg(a, b, roll(), sa, sb);
    const db = calcDmg(b, a, roll(), sb, sa);
    let daa = da, dbb = db, fk = 0, blkA = false, blkB = false, drA = 0, drB = 0, tvA = 0, tvB = 0;
    const hitB = () => { if (!shB[ib] && daa > 0) { shB[ib] = true; daa = 0; blkB = true; } hb[ib] -= daa; };
    const hitA = () => { if (!shA[ia] && dbb > 0) { shA[ia] = true; dbb = 0; blkA = true; } ha[ia] -= dbb; };
    const fa1 = traitOf(a) === "first", fb1 = traitOf(b) === "first";
    if (fa1 && !fb1) { hitB(); if (hb[ib] <= 0) { dbb = 0; fk = 1; } else hitA(); }
    else if (fb1 && !fa1) { hitA(); if (ha[ia] <= 0) { daa = 0; fk = -1; } else hitB(); }
    else { hitB(); hitA(); }
    const killB = hb[ib] <= 0, killA = ha[ia] <= 0;
    let reA = 0, reB = 0;
    if (traitOf(a) === "regen" && ha[ia] > 0) { const nh = Math.min(mxA[ia], ha[ia] + Math.max(1, Math.round(mxA[ia] * 0.08))); reA = nh - ha[ia]; ha[ia] = nh; }
    if (traitOf(b) === "regen" && hb[ib] > 0) { const nh = Math.min(mxB[ib], hb[ib] + Math.max(1, Math.round(mxB[ib] * 0.08))); reB = nh - hb[ib]; hb[ib] = nh; }
    // 遺言（相手が生きている場合のみ・連鎖しない）／凱旋
    const rA = killA && !killB && kwOf(a) === "rattle" ? Math.max(1, roundHalfEven(a.atk * 0.6)) : 0;
    const rB = killB && !killA && kwOf(b) === "rattle" ? Math.max(1, roundHalfEven(b.atk * 0.6)) : 0;
    if (rA) { drA = rA; hb[ib] -= rA; }
    if (rB) { drB = rB; ha[ia] -= rB; }
    if (killB && ha[ia] > 0 && kwOf(a) === "triumph") { const nh = Math.min(mxA[ia], ha[ia] + Math.max(1, roundHalfEven(mxA[ia] * 0.15))); tvA = nh - ha[ia]; ha[ia] = nh; }
    if (killA && hb[ib] > 0 && kwOf(b) === "triumph") { const nh = Math.min(mxB[ib], hb[ib] + Math.max(1, roundHalfEven(mxB[ib] * 0.15))); tvB = nh - hb[ib]; hb[ib] = nh; }
    const entry = { fk, reA, reB, blkA, blkB, drA, drB, tvA, tvB, round: r, ia, ib, fromA, fromB, actA: sa, actB: sb, da: daa, db: dbb, aAttr: attrMult(a.attr, b.attr), bAttr: attrMult(b.attr, a.attr), koA: false, koB: false };
    if (hb[ib] <= 0) { const k = firstAlive(hb, -1); if (k >= 0) { ib = k; } entry.koB = true; }
    if (ha[ia] <= 0) { const k = firstAlive(ha, -1); if (k >= 0) { ia = k; } entry.koA = true; }
    entry.nia = ia; entry.nib = ib;
    entry.ha = ha.slice(); entry.hb = hb.slice();
    log.push(entry);
    const deadA = ha.every(x => x <= 0), deadB = hb.every(x => x <= 0);
    if (deadA || deadB) {
      return { rounds: r, how: "wipe", res: (deadA && deadB) ? 0 : (deadB ? 1 : -1), ha, hb, maxA, maxB, log, ua, ub };
    }
  }
  const fa = ha.reduce((s, x) => s + Math.max(0, x), 0) / maxA;
  const fb = hb.reduce((s, x) => s + Math.max(0, x), 0) / maxB;
  const res = Math.abs(fa - fb) < 1e-12 ? 0 : (fa > fb ? 1 : -1);
  return { rounds: cap, how: "t10", res, ha, hb, maxA, maxB, fa, fb, log, ua, ub };
}
// 向導（チームに1人。自分側だけに効く）
const GUIDES = { sea: ["航海士", "前列のATK+8%"], city: ["建築家", "全員のDEF+10%"], mount: ["登山家", "全員のHP+6%"], hist: ["語り部", "後列のATK+10%・HP+10%"] };
function applyGuide(cards, g) {
  if (!GUIDES[g]) return cards;

function toast(m) { UI.toast = m; render(); setTimeout(() => { if (UI.toast === m) { UI.toast = ''; render(); } }, 2200); }
/* ---------- 追加機能：実績・旅・首領・挑戦・共有 ---------- */
const SITE_URL = 'https://chizukan-game.vercel.app/';
const ownN = () => Object.keys(S.owned).length;

const rewardText = r => [r.packs ? `+${r.packs}パック` : '', r.mp ? `+${r.mp}P` : ''].filter(Boolean).join('・');
UI.achq = [];
function notifyAch(list) { (list || []).forEach(x => { if (ACH_BY[x.id]) UI.achq.push(x); }); }
function flushAch() {
  if (UI.battle || UI.reveal || UI.toast || !UI.achq.length || !NET.ready) return;
  const x = UI.achq.shift(), a = ACH_BY[x.id];
  if (x.lv) { toast(`⭐ 報酬トラック Lv${x.lv}！ ${rewardText(x.r)}`); SFX.chime && SFX.chime(3); return; }
  toast(`🏆 実績「${a[1]}」解除！ ${rewardText(x.r)}`); SFX.chime && SFX.chime(3);

  '山岳': ['{n}で、澄んだ空気の中をゆっくり登り、雲の上の景色を見てきました。', '{n}の山道で、足もとの小石を数えながら頂上をめざしました。', '{n}で、湧き水をひと口。冷たさが体にしみわたりました。'],

  '都市': ['「灯りの数だけ、物語がある。今夜も増えていくよ。」', '「にぎやかなほうが、落ち着くんだ。」', '「ここは出会いの交差点。ようこそ。」'],
  '山岳': ['「急がなくていい。山は動かないから。」', '「頂上は、いつもそこにある。」', '「ふむ。そのくらいの風なら、びくともしないよ。」'],
  '歴史': ['「長い時間を歩いてきた。まだ先も見届けるつもりだ。」', '「古いものほど、語ることが多いのだよ。」', '「すべてが昔話になる前に、いま会えてよかった。」'],

const pickBy = (arr, k) => arr[Math.abs(k) % arr.length];
function tripStory(id, n) { const c = BY_ID[id]; if (!c) return ''; return pickBy(TRIP_TXT[c.attr] || TRIP_TXT['都市'], id + n).replace('{n}', c.name.replace(/（.*?）/g, '')); }
function quoteOf(c) { return c.rar === 'SR' || c.rar === 'SSR' ? pickBy(QUOTE_TXT[c.attr] || QUOTE_TXT['都市'], c.id * 7 + c.atk) : ''; }

// ---- ランキングと挑戦 ----
UI.lb = null; UI.lbLoading = false;
async function fetchLB(force) {
  if (UI.lbLoading || (UI.lb && !force)) return;
  UI.lbLoading = true;
  try { UI.lb = (await api('lb')).r; } catch (e) { UI.lb = { lb: [], me: null, err: true }; }
  UI.lbLoading = false; if (NET.ready && !UI.battle && !UI.reveal && (UI.tab === 'battle' || UI.tab === 'log')) render();
}
function bossHTML() {
  const b = S.boss, cards = (b.ids || []).map(i => BY_ID[i]).filter(Boolean);
  if (cards.length !== 3) return '';
  const st = b.done ? (b.res === 1 ? '撃破済み' : '挑戦済み') : '未挑戦';
  return `<h2>今日の首領</h2><div class="box"><div class="row sp"><b>毎日入れ替わる強敵</b><span class="pill">${st}</span></div>
    <div class="grid" style="margin-top:8px">${cards.map(c => cardHTML(c, true)).join('')}</div>
    <p class="muted" style="font-size:12px;margin:6px 0">日本時間の0時に入れ替わります。<b>1日1回</b>だけ挑戦でき、勝つと<b>+2パック・+10P</b>、負けても<b>+3P</b>。対戦ptは増減せず、1日の対戦回数にも数えません。途中で閉じても挑戦済みになります。</p>
    <button class="btn" data-a="boss" ${b.done ? 'disabled' : ''}>${b.done ? '今日は挑戦済み' : '首領に挑む'}</button></div>`;
}
function challengeHTML() {
  const L = UI.lb, left = S.ch.max - S.ch.n;
  let rows;
  if (!L) rows = '<p class="muted">読み込み中…</p>';
  else if (L.err) rows = '<p class="muted">ランキングを読み込めませんでした。<button class="btn sm sub" data-a="lbreload">再読み込み</button></p>';
  else if (!L.lb.length) rows = '<p class="muted">まだ誰も載っていません。「記録」タブで名前を登録すると、あなたのチームが載ります。</p>';
  else rows = L.lb.map(x => {
    const me = x.pub === S.pub, done = (S.ch.ids || []).includes(x.pub), ok = !me && !done && left > 0 && S.battlesToday < DAILY_BATTLES && teamOK();
    return `<div class="row sp logline"><span>${x.rk}. <b>${esc(x.n)}</b> <span class="muted">${RANKS[rankIdx(x.pts)][1]}・${x.pts}pt</span></span>${me ? '<span class="pill">あなた</span>' : done ? '<span class="pill">挑戦済</span>' : `<button class="btn sm sub" data-a="challenge" data-k="${x.pub}" ${ok ? '' : 'disabled'}>挑戦</button>`}</div>`;

}

// ---- シーズン／デイリークエスト／カード裏面／はじめてガイド ----
function notifyLv(list) { (list || []).forEach(x => UI.achq.push({ lv: x.lv, r: { packs: x.packs, mp: x.mp } })); }
function trackLine() { const t = S.track; if (!t) return ''; return t.lv >= t.max ? `報酬トラック Lv${t.lv}（最大）` : `報酬トラック Lv${t.lv}　次まで ${t.per - (t.xp % t.per)}XP`; }
function trackHTML() {
  const t = S.track; if (!t) return '';
  const pct = t.lv >= t.max ? 100 : Math.round((t.xp % t.per) / t.per * 100);
  return `<h2>報酬トラック <span class="muted" style="font:400 13px var(--sans)">Lv ${t.lv} / ${t.max}</span></h2><div class="box">
    <div class="bar" style="height:8px;background:var(--line);border-radius:4px;overflow:hidden"><i style="display:block;height:100%;width:${pct}%;background:var(--red,#b33)"></i></div>
    <p class="muted" style="font-size:12px;margin:8px 0 0">${t.next ? `次のレベルの報酬：<b>${rewardText(t.next)}</b>（あと ${t.per - (t.xp % t.per)}XP）` : '最大レベルに到達しました。'}<br>XPは 対戦（勝ち30・それ以外15）、開封10、クエスト20、旅5 でたまります。レベルが上がると報酬は自動で届き、シーズンごとにリセットされます。5レベルごとにパック+1、Lv30でパック+3。</p></div>`;
}

}

const QUEST_TXT = { q_win2: '対戦で2回勝つ', q_win4: '対戦で4回勝つ', q_pack2: 'パックを2回開ける', q_bat5: '対戦を5回行う', q_trip: '今日の旅に出す', q_boss: '今日の首領に挑む', q_ch: '他のプレイヤーに挑戦する' };

const BACKS_DEF = [['default', '標準', null], ['sakura', '桜', 'dex_25'], ['indigo', '藍', 'win_10'], ['gold', '金箔', 'dex_50'], ['seal', '朱印', 'boss_win'], ['night', '夜景', 'rank_300'], ['world', '世界', 'dex_100']];

function tutorialHTML() {
  const st = S.stats, battled = st.w + st.l + st.d;

}

function viewLog() {
  fetchLB();
  const t = S.trip, nameForm = `<div class="box"><p><b>ランキング用の名前</b></p><p class="muted" style="font-size:12px;margin:0 0 6px">名前を登録すると、ランキングに載り、他のプレイヤーが挑戦できるようになります（編成中の3枚が相手に使われます）。12文字まで・文字／数字／スペース／_／-・変更は1日1回。本名や連絡先は入れないでください。登録しなければ載りません。</p>
    <div class="row" style="gap:6px"><input class="codebox" id="namein" maxlength="12" style="min-height:0;height:40px;flex:1" placeholder="例：タビビト" value="${esc(UI.namein !== undefined ? UI.namein : S.name || '')}"><button class="btn sm" data-a="setname">登録</button></div>
    ${S.name ? `<p class="muted" style="font-size:12px">現在の名前：<b>${esc(S.name)}</b></p>` : ''}</div>`;
  const story = t.done && BY_ID[t.last] ? `<div class="box" style="margin-top:8px"><div class="row" style="gap:10px;align-items:flex-start"><div style="width:84px;flex:none">${cardHTML(BY_ID[t.last], true)}</div><div class="dt"><p style="margin:0">${esc(tripStory(t.last, t.n))}</p>${quoteOf(BY_ID[t.last]) ? `<div class="fl">${esc(quoteOf(BY_ID[t.last]))}</div>` : ''}<p class="muted" style="font-size:11px;margin:4px 0 0">※旅の話・台詞はゲーム用の創作です。</p></div></div></div>` : '';
  const trip = `<h2>今日の旅</h2><div class="box"><p class="muted" style="font-size:12px;margin:0 0 6px">1日1回、持っているカードの中から1枚が旅に出て、地図ポイント <b>+2P</b> を持ち帰ります（これまで ${t.n} 回）。</p>
    <button class="btn" data-a="trip" ${t.done || !ownN() ? 'disabled' : ''}>${t.done ? '今日の旅は出発済み' : ownN() ? '旅に出す' : 'カードがありません'}</button>${story}</div>`;
  const done = ACH_DEF.filter(a => S.ach[a[0]]).length;
  const ach = ACH_DEF.map(a => {
    const got = !!S.ach[a[0]], [c, m] = a[4](), p = Math.min(1, m ? c / m : 0);

function wrapText(ctx, text, x, y, maxW, lh, maxLines) {
  let line = '', n = 0;
  for (const ch of text) {
    if (ctx.measureText(line + ch).width > maxW && line) { ctx.fillText(line, x, y); y += lh; line = ch; if (++n >= maxLines) return y; } else line += ch;
  }

}

async function shareCard(id) {

}

, and use no ads or analytics."], ["ブラウザのデータを消す・機種を変える前に、引き継ぎコードを控えてください。", "清除浏览器数据或换机前，请记下继承码。", "Note your recovery code before clearing browser data or changing devices."], ["「対戦」で最初の勝負！スキル（交代・防御・強攻）は合計3回まで使えます。", "在「对战」里打第一场！技能（交代・防御・强攻）合计最多用3次。", "Play your first battle! Skills (swap, guard, rush) can be used 3 times in total."], ["ポイント・1日の回数・クエストに数えない練習試合です。何度でもできます。", "不计入积分、每日次数和任务的练习赛，可无限次进行。", "Practice matches that don't count toward points, daily limits or quests. Play as often as you like."], ["無料でお楽しみいただけます。課金・カードの売買・交換機能はありません。", "可免费游玩。没有付费、卡牌买卖及交易功能。", "Free to play. There are no purchases or card trading."], ["敗で終了。対戦ptと1日の回数には数えません。途中で閉じると1敗です。", "败结束。不计入对战pt和每日次数。中途关闭算1败。", " losses ends the run. Doesn't count toward battle pt or daily limits. Closing mid-battle counts as a loss."], ["保存されている鍵が無効です。引き継ぎコードがあれば入力してください。", "保存的密钥无效。如有继承码请输入。", "The saved key is invalid. Enter your recovery code if you have one."], ["人。相手が最後に編成した3枚と対戦します（相手は操作しません）。", "名。对手使用其最后编队的 3 张卡（对手无需操作）。", ". You face the last team they set (they don't play)."], ["引き継ぎコードは合鍵と同じなので、他の人には見せないでください。", "继承码相当于备用钥匙，请勿给他人看。", "The recovery code works like a spare key, so don't show it to others."], ["は毎日3つ（全員共通）。全部達成でボーナスのパックがもらえます。", "每天3个（所有人相同）。全部完成可得奖励卡包。", "3 per day (same for everyone). Finish all for a bonus pack."], ["1日1回、持っているカードの中から1枚が旅に出て、地図ポイント", "每天 1 次，从你拥有的卡中派 1 张去旅行，带回地图点", "Once a day, one of your cards goes on a trip and brings back map points "], ["対戦の途中で閉じる・再読み込みすると敗北として記録されます。", "对战中途关闭或刷新会记为失败。", "Closing or reloading mid-battle counts as a loss."], ["：3枚を前列から並べ、双方の最前列が同時に攻撃します。最大", "：3 张从前排排列，双方最前排同时攻击。最多", ": 3 cards line up from the front, and both front cards attack at once. Up to "], ["チームは3つまで保存でき、選んでいるチームで対戦します。", "最多可保存3支队伍，用当前选中的队伍对战。", "Save up to 3 teams; you battle with the selected one."], ["属性は 海洋→都市→山岳→歴史→海洋 の順に有利です。", "属性克制顺序：海洋→都市→山岳→历史→海洋。", "Attribute advantage: Sea → City → Mountain → History → Sea."], ["日）　月が変わると最高ランクに応じた報酬、ptは半分に", "天）   ['自動で対戦', '「対戦」で相手と戦います。毎回合の前に「交代・防御・強攻」を選べます（1戦3回まで）。勝つと+12pt、負けると−6pt。ptが貯まるとランクが上がります。毎日の「今日の首領」や、ランキングの相手への挑戦もあります。']
];
function tutHTML() {
  const i = UI.tut, last = i === TUT.length - 1;
  return `<div class="tut"><div class="tb"><h3>${TUT[i][0]}</h3><p>${TUT[i][1]}</p><div class="dots">${TUT.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>
  <div class="row"><button class="btn sub" data-a="tutskip">${last ? '閉じる' : 'スキップ'}</button><button class="btn" data-a="tutnext">${last ? 'はじめる' : '次へ'}</button></div></div></div>`;
}
function bootHTML() {
  if (!NET.err) return `<div class="proto">公開テスト版</div><div style="padding:80px 20px;text-align:center"><div class="logo" style="font-size:28px">Chizukan<small>チズカン</small></div><p class="muted" style="margin-top:18px">読み込み中…</p></div>`;
  if (NET.err === 'auth') return `<div class="proto">公開テスト版</div><div style="padding:40px 20px"><h2>アカウントを確認できません</h2><p class="muted">保存されている鍵が無効です。引き継ぎコードがあれば入力してください。</p>
    <textarea class="codebox" id="icode" placeholder="CZA1. で始まるコードを貼り付け" style="display:block">${esc(UI.icode || '')}</textarea><div class="muted" style="color:var(--red);min-height:16px">${esc(UI.imsg || '')}</div>
    <button class="btn" data-a="doimport">コードで引き継ぐ</button>
    <button class="btn sub" style="margin-top:10px" data-a="newacct">${UI.newArmed ? '本当に新しく始める（元の進行状況は戻せません）' : '新しく始める'}</button></div>`;
  return `<div class="proto">公開テスト版</div><div style="padding:60px 20px;text-align:center"><h2>通信できませんでした</h2><p class="muted">${esc(NET.msg || '')}</p><button class="btn" data-a="retry">もう一度試す</button></div>`;
}
function render() {
  if (!NET.ready) { $('app').innerHTML = bootHTML(); return; }
  window.CARD_STYLE = S.cardStyle || 'line';
  tick();
  const view = { pack: viewPack, dex: viewDex, team: viewTeam, battle: viewBattle, log: viewLog, info: viewInfo }[UI.tab]();
  const tabs = [['pack', 'パック'], ['dex', '図鑑'], ['team', '編成'], ['battle', '対戦'], ['log', '記録'], ['info', '情報']]
    .map(([k, l]) => `<button class="${UI.tab === k ? 'on' : ''}" data-a="tab" data-k="${k}">${l}</button>`).join('');
  $('app').innerHTML = `<div class="proto">公開テスト版（規則 ${RULES_VERSION}）</div>
  <header class="top"><div class="logo">Chizukan<small>チズカン</small></div><div class="pts"><span class="rankchip">${rankInfo(S.points).name}</span>対戦pt <b style="display:inline;font-size:16px">${S.points}</b><br>地図P <b style="display:inline;font-size:16px">${S.mp}</b><button class="mute" data-a="mute">${S.mute ? '🔇' : '🔊'}</button></div></header>
  <main>${view}</main><nav class="tabs">${tabs}</nav>
  ${UI.tut != null ? tutHTML() : ''}${revealHTML()}${exchHTML()}${detailHTML()}${shareHTML()}<div id="ovb">${battleHTML()}</div>${UI.toast ? `<div class="toast">${esc(UI.toast)}</div>` : ''}`;
}

/* ---------- 操作 ---------- */
document.addEventListener('input', e => { if (!e.target) return; if (e.target.id === 'icode') { UI.icode = e.target.value; UI.imsg = ''; } else if (e.target.id === 'fbbody') UI.fbbody = e.target.value; else if (e.target.id === 'namein') UI.namein = e.target.value; });
document.addEventListener('click', e => {
  SFX.init();
  const t = e.target.closest('[data-a]'); if (!t) return;
  const a = t.dataset.a, k = t.dataset.k;
  if (a === 'tab') { UI.toast = ''; UI.tab = k; render(); window.scrollTo(0, 0); }
  else if (a === 'filter') { UI.filter = k; render(); }
  else if (a === 'fr') { UI.fr = k; render(); }
  else if (a === 'fa') { UI.fa = k; render(); }
  else if (a === 'own') { UI.own = k; render(); }
  else if (a === 'sort') { UI.sort = k; render(); }
  else if (a === 'pfa') { UI.pfa = k; render(); }
  else if (a === 'showacct') { UI.xcode = acctCode(); render(); const el = $('xcode'); if (el) { el.focus(); el.select(); } }
  else if (a === 'doimport') { const el = $('icode'); restoreAcct(el ? el.value : UI.icode).then(msg => { UI.imsg = msg; if (!msg) { UI.tab = 'pack'; UI.icode = ''; UI.xcode = ''; render(); toast('引き継ぎました'); } else render(); }); }
  else if (a === 'retry') boot()
  else if (a === 'newacct') { if (!UI.newArmed) { UI.newArmed = true; render(); } else { UI.newArmed = false; try { localStorage.removeItem(AKEY); } catch (e) {} ACCT = null; S = fresh(); loadPrefs(); boot(); } }
  else if (a === 'retryfin') { const b = UI.battle; if (b && b.finErr) { sendFinish(b); renderBattle(); } }
  else if (a === 'detail') { UI.detail = +k; UI.back = false; render(); }
  else if (a === 'cardstyle') { S.cardStyle = k === 'ink' ? 'ink' : 'line'; save(); render(); }
  else if (a === 'flipback') { UI.back = !UI.back; render(); }
  else if (a === 'closedetail') { UI.detail = null; render(); }
  else if (a === 'exchopen') { UI.exch = +k; render(); }
  else if (a === 'closeexch') { UI.exch = null; render(); }
  else if (a === 'exch') { const c = BY_ID[+k]; if (c && !S.owned[c.id] && S.mp >= EXCH_COST[c.rar]) act('exchange', { id: c.id }).then(r => { if (r && r.cards) { UI.exch = null; UI.reveal = { cards: r.cards, flipped: [false], gold: false }; } render(); }); }
  else if (a === 'noop') { }
  else if (a === 'open') { tick(); if (S.packs <= 0) { toast('パックはまだ届いていません'); return; } act('open').then(r => { if (r && r.cards) { UI.reveal = { cards: r.cards, flipped: r.cards.map(() => false), gold: r.gold, tear: true }; render(); SFX.tear(bestRar(UI.reveal)); setTimeout(endTear, 1550); } else render(); }); }
  else if (a === 'skiptear') { endTear(); }
  else if (a === 'mute') { S.mute = !S.mute; save(); if (!S.mute) { SFX.init(); SFX.chime(2); } render(); }
  else if (a === 'flip') { revealFlip(+k); }
  else if (a === 'flipall') { UI.reveal.flipped.forEach((f, i) => { if (!f) setTimeout(() => revealFlip(i), i * 220); }); }
  else if (a === 'closereveal') { UI.reveal = null; render(); }
  else if (a === 'claim') { act('claim', { k }).then(r => { if (r) toast('パックを1つ受け取りました'); else render(); }); }
  else if (a === 'slot') { UI.pick = +k; render(); }
  else if (a === 'closepick') { UI.pick = null; render(); }
  else if (a === 'assign') {
    const id = +k, i = UI.pick, team = S.team.slice(); while (team.length < 3) team.push(0);
    const j = team.indexOf(id);
    if (j >= 0 && j !== i) { team[j] = team[i]; }
    team[i] = id; S.team = team.map(x => x || 0);
    UI.pick = null; render(); sendTeam();
  }
  else if (a === 'auto') {
    S.team = CARDS.filter(c => S.owned[c.id]).sort((x, y) => (y.atk + y.hp + y.def) - (x.atk + x.hp + x.def)).slice(0, 3).map(c => c.id); render(); sendTeam();
  }
  else if (a === 'fight') startBattle();
  else if (a === 'boss') startBattle(null, 'boss');
  else if (a === 'prac') startBattle(null, 'prac', k);
  else if (a === 'afight') startBattle(null, 'arena');
  else if (a === 'brawl') startBattle(null, 'brawl');
  else if (a === 'astart') { act('arena', { op: 'start' }).then(() => render()); }
  else if (a === 'apick') { act('arena', { op: 'pick', i: +k }).then(() => render()); }
  else if (a === 'guide') { act('guide', { id: k }).then(() => render()); }
  else if (a === 'deck') { if (+k !== (S.deckIdx || 0)) teamChain = teamChain.then(() => act('deck', { i: +k })).then(() => render()); }
  else if (a === 'challenge') startBattle(null, 'ch', k);
  else if (a === 'lbreload') { UI.lb = null; fetchLB(true); render(); }
  else if (a === 'qclaim') { act('claim', { k }).then(r => { if (r) toast(S.tasks.qc.includes('bonus') && k !== 'bonus' && S.quests.list.every(q => q.claimed) ? 'ボーナスのパック+1！' : '地図ポイントを受け取りました'); render(); }); }
  else if (a === 'setback') { act('back', { id: k }).then(r => { if (r) toast('カードの裏面を変更しました'); render(); }); }
  else if (a === 'trip') { act('trip').then(r => { if (r) { SFX.chime && SFX.chime(2); } render(); }); }
  else if (a === 'setname') { const el = $('namein'), v = (el ? el.value : UI.namein || '').trim(); act('name', { name: v }).then(r => { if (r) { UI.namein = undefined; UI.lb = null; toast('名前を登録しました'); } }); }
  else if (a === 'share') shareCard(+k);
  else if (a === 'closeshare') { if (UI.shareImg) URL.revokeObjectURL(UI.shareImg); UI.shareImg = null; render(); }
  else if (a === 'replay') { const h = S.history[+k]; if (h) startBattle({ A: h.A, B: h.B, seed: h.seed, pa: h.pa, g: h.g, rule: h.rule }); }
  else if (a === 'skl') chooseSkill(k)
  else if (a === 'skip') { const b = UI.battle; if (b) {
    clearBT(); b.vs = false;
    if (b.live) { for (let r = b.step; r < MAX_ROUNDS; r++) b.plan.a[r] = 'auto'; finalizeBattle(b); b.live = false; }
    b.step = b.res.log.length; b.done = true; b.choosing = false; showResult(b); } }
  else if (a === 'bspeed') { UI.bspeed = UI.bspeed === 1 ? 2 : 1; renderBattle(); }
  else if (a === 'closebattle') { UI.battle = null; clearBT(); render(); }
  else if (a === 'tutnext') { if (UI.tut >= TUT.length - 1) { UI.tut = null; S.tutDone = true; save(); } else UI.tut++; render(); }
  else if (a === 'tutskip') { UI.tut = null; S.tutDone = true; save(); render(); }
  else if (a === 'tutshow') { UI.tut = 0; render(); }
  else if (a === 'fbsend') { const body = (UI.fbbody || '').trim(); if (!body) { toast('内容を入力してください'); return; } act('feedback', { body, ua: navigator.userAgent.slice(0, 160) }).then(r => { if (r) { UI.fbbody = ''; toast('送信しました。ありがとうございます'); } else render(); }); }
  else if (a === 'lang') setLang(k);
  else if (a === 'reset') doReset();
});
function revealFlip(i) {
  const r = UI.reveal; if (!r || r.flipped[i]) return;
  r.flipped[i] = true; SFX.flip(BY_ID[r.cards[i].id].rar);
  const el = document.querySelectorAll('.pack3 .flip')[i]; if (el) el.classList.add('open');
  const bt = $('revbtn'); if (bt) bt.innerHTML = revBtn();
  const h = $('rarhint'); if (h) h.textContent = rarHint();
}
function tiltMove(e) {
  const el = document.querySelector('.detail .card'); if (!el) return;
  const r = el.getBoundingClientRect(), pt = e.touches ? e.touches[0] : e;
  const x = (pt.clientX - r.left) / r.width - .5, y = (pt.clientY - r.top) / r.height - .5;
  if (Math.abs(x) > 1.2 || Math.abs(y) > 1.2) return;
  el.style.transform = `perspective(600px) rotateY(${(x * 22).toFixed(1)}deg) rotateX(${(-y * 22).toFixed(1)}deg)`;
}
function tiltEnd() { const el = document.querySelector('.detail .card'); if (el) el.style.transform = ''; }
document.addEventListener('pointermove', tiltMove); document.addEventListener('touchmove', tiltMove, { passive: true });
document.addEventListener('pointerup', tiltEnd); document.addEventListener('touchend', tiltEnd);
function doReset() {
  const ok = UI.resetArmed;
  if (!ok) { UI.resetArmed = true; toast('もう一度押すと進行状況が消えます'); setTimeout(() => { UI.resetArmed = false; }, 4000); return; }
  UI.resetArmed = false; act('reset').then(r => { if (r) { UI.tab = 'pack'; render(); toast('リセットしました'); } });
}
loadPrefs();
boot();
applyLang();
try { if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
document.addEventListener('visibilitychange', () => { if (!document.hidden && NET.ready && !NET.busy && !UI.battle && !UI.reveal) refresh(); });
setInterval(() => { if (UI.tab === 'pack' && !UI.reveal && !UI.detail && !UI.battle) render(); }, 30000);
</script>
</body>
